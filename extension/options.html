<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>ytsum</title>
<style>
  :root { --text:#15181c; --text-2:#5c6670; --border:#d5d9de; --surface:#fff; --surface-2:#f3f4f6; --accent:#e03131; --ok:#2f9e44; }
  @media (prefers-color-scheme: dark) { :root { --text:#e9ecef; --text-2:#a4acb5; --border:#3a414a; --surface:#1f2329; --surface-2:#171a1f; --accent:#ff6b6b; --ok:#51cf66; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 20px 20px; min-width: 520px; color: var(--text); background: var(--surface);
         font: 14px/1.5 -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 14px; font-weight: 650; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; }
  .row b { font-weight: 550; display: block; }
  .row small { color: var(--text-2); font-size: 12.5px; }
  select, textarea { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; }
  select { padding: 6px 10px; }
  select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--text-2) 40%, transparent); outline-offset: 1px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .tpl { padding-top: 10px; border-top: 1px solid var(--border); }
  textarea { width: 100%; min-height: 170px; margin-top: 8px; padding: 10px 12px; font: 12.5px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; resize: vertical; }
  code { font: 12px ui-monospace, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; min-height: 28px; }
  #status { color: var(--ok); font-size: 12.5px; opacity: 0; transition: opacity .15s; }
  #status.show { opacity: 1; }
  button { font: inherit; font-size: 13px; color: var(--text-2); background: none; border: 0; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  button:hover { background: var(--surface-2); color: var(--text); }
</style>
</head>
<body>
  <h1>ytsum</h1>
  <label class="row">
    <span><b>Envoyer automatiquement</b><small>Sinon le prompt est seulement inséré dans ChatGPT, à toi d'appuyer sur Entrée.</small></span>
    <input type="checkbox" id="autoSend">
  </label>
  <label class="row">
    <span><b>Sous-titres préférés</b><small>Les sous-titres rédigés à la main passent avant les automatiques.</small></span>
    <select id="langs">
      <option value="fr,en">Français, puis anglais</option>
      <option value="en,fr">Anglais, puis français</option>
    </select>
  </label>
  <div class="tpl">
    <b>Prompt</b><br>
    <small style="color:var(--text-2)">Variables : <code>{title}</code> <code>{channel}</code> <code>{url}</code> <code>{transcript}</code></small>
    <textarea id="template" spellcheck="false"></textarea>
    <div class="foot"><span id="status">Enregistré ✓</span><button id="reset" type="button">Rétablir le prompt par défaut</button></div>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
