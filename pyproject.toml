[project]
name = "ytsum"
version = "0.1.0"
description = "Transcript YouTube -> prompt de résumé dans le presse-papier"
readme = "README.md"
authors = [
    { name = "Sulliwen", email = "sullivan.bitho@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "pyperclip>=1.11.0",
    "yt-dlp[curl-cffi]>=2026.8.19",
]

[project.scripts]
ytsum = "ytsum:main"
ytsum-web = "ytsum.web:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
